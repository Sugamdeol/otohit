# Render Blueprint — deploys OtoHits as a Web Service on Render's free plan.
# The Dockerfile keeps the official client as the main process and adds a
# minimal /healthz endpoint because Render Web Services must bind $PORT.
services:
  - type: web
    name: otohits
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APPLICATION_KEY
        # Render will prompt for this value during Blueprint setup and store it
        # as a secret. Never put a real application key in this repository.
        sync: false
